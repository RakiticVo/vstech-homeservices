        totalCompletedJobs:
          type: integer
          format: int32
        averageRating:
          type: number
        cancellationRate:
          type: number
        badgeTier:
          type: string
    WorkerSkillDTO:
      type: object
      properties:
        categoryId:
          type: integer
          format: int64
        experienceYears:
          type: integer
          format: int32
        certificateUrl:
          type: string
        isVerified:
          type: boolean
