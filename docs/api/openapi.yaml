          $ref: "#/components/schemas/WorkerKycDTO"
        workerMetrics:
          $ref: "#/components/schemas/WorkerMetricsDTO"
        workerSkills:
          type: array
          items:
            $ref: "#/components/schemas/WorkerSkillDTO"
    UserProfileUpdateRequest:
      type: object
      properties:
        fullName:
          type: string
        avatarUrl:
          type: string
        bio:
          type: string
        locale:
          type: string
        phoneNumber:
          type: string
        email:
          type: string
        defaultAddress:
          type: string
        lat:
          type: number
        lng:
          type: number
        idCardFrontUrl:
          type: string
        idCardBackUrl:
          type: string
    UserRole:
      type: string
      enum:
      - CUSTOMER
      - B2B_CUSTOMER
      - WORKER
      - SUPPLIER
      - ADMIN
    VoipCallResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        bookingId:
          type: integer
          format: int64
        callerId:
          type: integer
          format: int64
        receiverId:
          type: integer
          format: int64
        durationSeconds:
          type: integer
          format: int32
        recordingUrl:
          type: string
        startedAt:
          $ref: "#/components/schemas/OffsetDateTime"
        endedAt:
          $ref: "#/components/schemas/OffsetDateTime"
    WalletResponse:
      type: object
      properties:
        walletId:
          type: integer
          format: int64
        ownerId:
          type: integer
          format: int64
        balance:
          type: number
        frozenBalance:
          type: number
        currency:
          type: string
        walletType:
          $ref: "#/components/schemas/WalletType"
        createdAt:
          $ref: "#/components/schemas/OffsetDateTime"
    WalletTransactionResponse:
      type: object
      properties:
        transactionId:
          type: integer
          format: int64
        fromWalletId:
          type: integer
          format: int64
        toWalletId:
          type: integer
          format: int64
        referenceRequestId:
          type: integer
          format: int64
        amount:
          type: number
        delta:
          type: number
        txType:
          $ref: "#/components/schemas/TransactionType"
        status:
          $ref: "#/components/schemas/TransactionStatus"
        createdAt:
          $ref: "#/components/schemas/OffsetDateTime"
    WalletType:
      type: string
      enum:
      - USER
      - PLATFORM
      - SUPPLIER
    WithdrawalRejectDTO:
      type: object
      properties:
        reason:
          type: string
          maxLength: 500
    WithdrawalRequestDTO:
      type: object
      required:
      - amount
      - bankCode
      - bankAccountNumber
      properties:
        amount:
          type: number
          exclusiveMinimum: 0
        bankCode:
          type: string
          pattern: \S
        bankAccountNumber:
          type: string
          pattern: \S
    WithdrawalRequestResponse:
      type: object
      properties:
        requestId:
          type: integer
          format: int64
        workerId:
          type: integer
          format: int64
        walletId:
          type: integer
          format: int64
        amount:
          type: number
        bankCode:
          type: string
        bankAccountNumber:
          type: string
        status:
          $ref: "#/components/schemas/WithdrawalStatus"
        approvedBy:
          type: integer
          format: int64
        rejectionReason:
          type: string
        createdAt:
          $ref: "#/components/schemas/OffsetDateTime"
        updatedAt:
          $ref: "#/components/schemas/OffsetDateTime"
    WithdrawalStatus:
      type: string
      enum:
      - PENDING_APPROVAL
      - APPROVED
      - REJECTED
      - CANCELLED
    WorkerKycDTO:
      type: object
      properties:
        approvalStatus:
          type: string
        idCardNumber:
          type: string
        idCardFrontUrl:
          type: string
        idCardBackUrl:
          type: string
    WorkerMetricsDTO:
